<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="display-question">
      <div class="question">
        <div class="question-title">
          Was ist die Hauptstadt von Deutschland?
        </div>
        <div class="question-answers">
          <button class="answer incorrect">Paris</button>
          <button class="answer incorrect">London</button>
          <button class="answer incorrect">New York</button>
          <button class="answer correct">Berlin</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <button>Lösung</button>
      <button>Weiter</button>
    </div>
  </body>
</html>
